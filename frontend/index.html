<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Expense Tracker</title>
  <style>
    body { font-family: Arial; max-width: 600px; margin: 30px auto; }
    input, button { padding: 8px; margin: 4px 0; width: 100%; box-sizing: border-box; }
    li { display: flex; justify-content: space-between; margin: 6px 0; }
    .del { width: auto; background: #e74c3c; color: #fff; border: 0; cursor: pointer; }
  </style>
</head>
<body>
  <h2>💰 Expense Tracker</h2>
  <input id="title" placeholder="Title (e.g. Chai)">
  <input id="amount" type="number" placeholder="Amount">
  <input id="category" placeholder="Category (e.g. Food)">
  <input id="date" type="date">
  <button onclick="addExpense()">Add Expense</button>

  <h3>Total: ₹<span id="total">0</span></h3>
  <ul id="list"></ul>

  <script>
    // Browser se backend call hota hai, isliye host ka IP/hostname use kar rahe hain
    const API = `http://${location.hostname}:8000`;

    async function load() {
      const res = await fetch(`${API}/expenses`);
      const data = await res.json();
      let total = 0;
      document.getElementById("list").innerHTML = data.map(e => {
        total += e.amount;
        return `<li><span>${e.date} | ${e.title} (${e.category}) - ₹${e.amount}</span>
                <button class="del" onclick="del(${e.id})">X</button></li>`;
      }).join("");
      document.getElementById("total").innerText = total.toFixed(2);
    }

    async function addExpense() {
      const body = {
        title: document.getElementById("title").value,
        amount: parseFloat(document.getElementById("amount").value),
        category: document.getElementById("category").value,
        date: document.getElementById("date").value
      };
      await fetch(`${API}/expenses`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      load();
    }

    async function del(id) {
      await fetch(`${API}/expenses/${id}`, { method: "DELETE" });
      load();
    }

    load();
  </script>
</body>
</html>
