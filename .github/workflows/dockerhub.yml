name: Build & Push

on:
  workflow_dispatch: 

jobs:
  Build-and-Push:
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Docker login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Frontend Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
             ${{ vars.DOCKERHUB_USERNAME }}/github-action-app:${{ github.ref_name }}
             ${{ vars.DOCKERHUB_USERNAME }}/github-action-app:latest
             ${{ vars.DOCKERHUB_USERNAME }}/github-action-app:${{ github.sha}}
             
      - name: Backend Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
             ${{ vars.DOCKERHUB_USERNAME }}/github-action-app:${{ github.ref_name }}
             ${{ vars.DOCKERHUB_USERNAME }}/github-action-app:latest
             ${{ vars.DOCKERHUB_USERNAME }}/github-action-app:${{ github.sha}}
